# AM243 Launchpad has an xds110 onboard.
source [find interface/xds110.cfg]

transport select jtag

# default JTAG configuration has only SRST and no TRST
reset_config srst_only srst_push_pull

# delay after SRST goes inactive
adapter srst delay 20

if { ![info exists SOC] } {
	set SOC am243
}

source [find target/ti/k3.cfg]

# 250 kHz is slow enough that a reset outlasts OpenOCD's GDB keepalive window
# and the connection is dropped. The XDS110 firmware here allows 14000 kHz, but
# USB round-trips dominate past a few MHz: a 32 KB RAM load takes 0.73 s at
# 2500 kHz and 0.42 s at 14000. 8500 keeps margin below the ceiling.
adapter speed 8500
