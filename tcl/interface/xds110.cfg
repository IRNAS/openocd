#
# Texas Instruments XDS110
#
# http://processors.wiki.ti.com/index.php/XDS110
# http://processors.wiki.ti.com/index.php/Emulation_Software_Package#XDS110_Support_Utilities
#

# Drive XDS110 output pin (0 or 1) to level for ms milliseconds, then to the
# opposite level. The pin stays an output, e.g. a reset or boot button line.
proc xds110_gpio_pulse { pin level ms } {
	if { $pin != 0 && $pin != 1 } {
		error "xds110_gpio_pulse: only GPIO 0 and 1 can be outputs"
	}
	set mask [expr {1 << $pin}]
	xds110 gpio config $mask $mask
	xds110 gpio write [expr {$level ? $mask : 0}] $mask
	sleep $ms
	xds110 gpio write [expr {$level ? 0 : $mask}] $mask
}

# Wait until XDS110 pin (0 to 3) reads level, polling every 10 ms. Fail if it
# does not within timeout_ms milliseconds.
proc xds110_gpio_wait { pin level timeout_ms } {
	set mask [expr {1 << $pin}]
	set want [expr {$level ? $mask : 0}]
	set deadline [expr {[ms] + $timeout_ms}]
	while { [xds110 gpio read $mask] != $want } {
		if { [ms] >= $deadline } {
			error "xds110_gpio_wait: GPIO $pin not $level after $timeout_ms ms"
		}
		sleep 10
	}
}

adapter driver xds110

# Use serial number option to use a specific XDS110
# when more than one are connected to the host.
# adapter serial 00000000
